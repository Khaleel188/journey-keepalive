name: Keepalive ping

on:
  schedule:
    # Every 12 minutes. GitHub Actions may delay scheduled runs by a few
    # minutes under load; disabled automatically after 60 days with no
    # repository activity (this workflow's own commits count as activity).
    - cron: "*/12 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: keepalive-ping
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      TARGET_URL: https://journey-xvdw.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Ping target
        id: ping
        run: |
          set +e
          started_ns=$(date +%s%N)
          http_code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$TARGET_URL")
          curl_exit=$?
          ended_ns=$(date +%s%N)
          latency_ms=$(( (ended_ns - started_ns) / 1000000 ))
          if [ "$curl_exit" -ne 0 ]; then
            http_code=0
          fi
          # "reached" means the server responded at all (any HTTP status),
          # which is what keeps Render from spinning the service down.
          # A 404/401/etc still counts — only a connection failure does not.
          reached=$([ "$curl_exit" -eq 0 ] && echo true || echo false)
          echo "http_code=$http_code" >> "$GITHUB_OUTPUT"
          echo "latency_ms=$latency_ms" >> "$GITHUB_OUTPUT"
          echo "reached=$reached" >> "$GITHUB_OUTPUT"
          echo "Pinged $TARGET_URL -> HTTP $http_code (reached=$reached) in ${latency_ms}ms"

      - name: Update status.json
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          path = "status.json"
          try:
              with open(path) as f:
                  data = json.load(f)
          except FileNotFoundError:
              data = {}

          http_code = int(os.environ["HTTP_CODE"])
          data["url"] = os.environ["TARGET_URL"]
          data["last_ping_at"] = datetime.now(timezone.utc).isoformat()
          data["status_code"] = http_code
          data["ok"] = os.environ["REACHED"] == "true"
          data["latency_ms"] = int(os.environ["LATENCY_MS"])
          data["runs"] = int(data.get("runs", 0)) + 1

          with open(path, "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
        env:
          TARGET_URL: https://journey-xvdw.onrender.com
          HTTP_CODE: ${{ steps.ping.outputs.http_code }}
          LATENCY_MS: ${{ steps.ping.outputs.latency_ms }}
          REACHED: ${{ steps.ping.outputs.reached }}

      - name: Commit status
        run: |
          git config user.name "keepalive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "No status change to commit"
            exit 0
          fi
          git commit -m "chore: keepalive ping [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing onto origin/main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Could not push status.json after retries"
          exit 1
